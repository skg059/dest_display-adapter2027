<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>DEST Wireless Display Receiver</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#mainImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#receiverVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div id="screen">

    <img id="mainImage" src="1.png" alt="DEST">

    <video
        id="receiverVideo"
        autoplay
        playsinline
    ></video>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>

// ========================================
// DEST Wireless Display Receiver
// SKREC_M001
// ========================================

// 基本設定
const ADAPTER_ID = "DEST/SKREC_M001";
const DATABASE_KEY = "DEST_SKREC_M001";
const PIN_CODE = "2394";

const START_DURATION = 7000;
const CONNECTED_IMAGE_DURATION = 5000;
const ERROR_DURATION = 5000;
const DISCONNECT_GRACE = 3000;

// Firebase設定
const firebaseConfig = {
    apiKey: "AIzaSyCcj7lgExzJp7hXMLUBV5ECHZmYj5mQQc",
    authDomain: "display-1-9b480.firebaseapp.com",
    projectId: "display-1-9b480",
    storageBucket: "display-1-9b480.firebasestorage.app",
    messagingSenderId: "934395065450",
    appId: "1:934395065450:web:7c42423e44d14361a50613",
    databaseURL:
    "https://display-1-9b480-default-rtdb.asia-southeast1.firebasedatabase.app"
};

// ========================================
// 初期化
// ========================================

const mainImage = document.getElementById("mainImage");
const video = document.getElementById("receiverVideo");

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const basePath = "adapters/" + DATABASE_KEY;

const offerRef = db.ref(basePath + "/offer");
const answerRef = db.ref(basePath + "/answer");
const senderCandidatesRef = db.ref(basePath + "/s");
const receiverCandidatesRef = db.ref(basePath + "/r");

let peer = null;
let remoteStream = null;
let currentSession = null;

let state = "startup";
let connectionTimer = null;
let errorTimer = null;
let disconnectTimer = null;
let candidateListener = null;
let offerListener = null;
let connectedTimer = null;

// ========================================
// 画像の先読み
// ========================================

["1.png", "2.png", "3.png", "4.png"].forEach(src => {
    const img = new Image();
    img.src = src;
});

// ========================================
// 画面表示
// ========================================

function showImage(src, newState) {

    state = newState;

    video.style.display = "none";
    video.srcObject = null;

    mainImage.src = src;
    mainImage.style.display = "block";
}

function showVideo() {

    state = "connected";

    mainImage.style.display = "none";
    video.style.display = "block";
}

// ========================================
// エラー処理
// ========================================

function showError(message) {

    if (state === "error") return;

    console.warn(message);

    clearTimeout(connectionTimer);
    clearTimeout(connectedTimer);
    clearTimeout(disconnectTimer);

    cleanupPeer();

    showImage("4.png", "error");

    errorTimer = setTimeout(() => {
        showImage("2.png", "waiting");
    }, ERROR_DURATION);
}

// ========================================
// 接続終了処理
// ========================================

function cleanupPeer() {

    clearTimeout(connectionTimer);
    clearTimeout(connectedTimer);
    clearTimeout(disconnectTimer);

    if (candidateListener) {
        senderCandidatesRef.off(
            "child_added",
            candidateListener
        );
        candidateListener = null;
    }

    if (peer) {
        peer.ontrack = null;
        peer.onicecandidate = null;
        peer.onconnectionstatechange = null;
        peer.close();
        peer = null;
    }

    if (remoteStream) {
        remoteStream.getTracks().forEach(track => {
            track.stop();
        });
        remoteStream = null;
    }

    video.pause();
    video.srcObject = null;
    video.style.display = "none";

    currentSession = null;
}

// ========================================
// 切断時
// ========================================

function returnToWaiting() {

    cleanupPeer();

    showImage("2.png", "waiting");

    console.log("待機画面に戻りました");
}

// ========================================
// 接続成功
// ========================================

function connectionSucceeded() {

    if (state === "connected" ||
        state === "connected-image") return;

    clearTimeout(connectionTimer);
    clearTimeout(disconnectTimer);

    state = "connected-image";

    showImage("3.png", "connected-image");

    console.log("WebRTC接続成功");

    connectedTimer = setTimeout(async () => {

        if (!peer || peer.connectionState !== "connected") {
            return;
        }

        showVideo();

        try {
            await video.play();
        } catch (error) {
            console.warn("映像再生エラー:", error);
        }

    }, CONNECTED_IMAGE_DURATION);
}

// ========================================
// ICE候補処理
// ========================================

async function addSenderCandidate(snapshot) {

    if (!peer || !peer.remoteDescription) return;

    const candidate = snapshot.val();

    if (!candidate) return;

    try {
        await peer.addIceCandidate(
            new RTCIceCandidate(candidate)
        );
    } catch (error) {
        console.warn("ICE候補エラー:", error);
    }
}

// ========================================
// WebRTC接続
// ========================================

async function receiveOffer(offer) {

    if (!offer || !offer.sdp || !offer.sessionId) {
        return;
    }

    if (offer.sessionId === currentSession) {
        return;
    }

    // PIN確認
    if (String(offer.pin) !== PIN_CODE) {
        showError("PINが一致しません");
        return;
    }

    if (state === "connected" ||
        state === "connected-image" ||
        state === "connecting") {
        return;
    }

    cleanupPeer();

    currentSession = offer.sessionId;
    state = "connecting";

    console.log("接続要求を受信");

    peer = new RTCPeerConnection({
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            },
            {
                urls: "stun:stun1.l.google.com:19302"
            }
        ]
    });

    remoteStream = new MediaStream();

    video.srcObject = remoteStream;

    // 映像・音声受信
    peer.ontrack = event => {

        const track = event.track;

        if (!remoteStream.getTracks().some(
            t => t.id === track.id
        )) {
            remoteStream.addTrack(track);
        }

        track.onended = () => {
            returnToWaiting();
        };

        if (state === "connected") {
            video.play().catch(() => {});
        }
    };

    // 受信側ICE候補
    peer.onicecandidate = event => {

        if (event.candidate && currentSession) {

            receiverCandidatesRef.push({
                candidate: event.candidate.candidate,
                sdpMid: event.candidate.sdpMid,
                sdpMLineIndex: event.candidate.sdpMLineIndex,
                sessionId: currentSession
            });
        }
    };

    // 接続状態監視
    peer.onconnectionstatechange = () => {

        if (!peer) return;

        const connectionState = peer.connectionState;

        console.log("接続状態:", connectionState);

        if (connectionState === "connected") {
            connectionSucceeded();
        }

        if (connectionState === "disconnected") {

            clearTimeout(disconnectTimer);

            disconnectTimer = setTimeout(() => {

                if (peer &&
                    peer.connectionState === "disconnected") {
                    returnToWaiting();
                }

            }, DISCONNECT_GRACE);
        }

        if (connectionState === "failed" ||
            connectionState === "closed") {

            returnToWaiting();
        }
    };

    // 送信側ICE候補の監視
    candidateListener = snapshot => {

        const data = snapshot.val();

        if (!data || data.sessionId !== currentSession) {
            return;
        }

        addSenderCandidate({
            val: () => data
        });
    };

    senderCandidatesRef.on(
        "child_added",
        candidateListener
    );

    try {

        // Offer設定
        await peer.setRemoteDescription(
            new RTCSessionDescription({
                type: "offer",
                sdp: offer.sdp
            })
        );

        // Answer生成
        const answer = await peer.createAnswer();

        await peer.setLocalDescription(answer);

        // FirebaseにAnswerを保存
        await answerRef.set({
            type: answer.type,
            sdp: answer.sdp,
            sessionId: currentSession
        });

        // 接続タイムアウト
        connectionTimer = setTimeout(() => {

            if (peer &&
                peer.connectionState !== "connected") {
                showError("接続タイムアウト");
            }

        }, 20000);

    } catch (error) {

        console.error("接続処理エラー:", error);
        showError("接続処理に失敗しました");
    }
}

// ========================================
// Firebase接続監視
// ========================================

function startListening() {

    offerListener = snapshot => {

        const offer = snapshot.val();

        if (!offer) return;

        receiveOffer(offer);
    };

    offerRef.on("value", offerListener, error => {
        console.error("Firebaseエラー:", error);
        showError("Firebase接続エラー");
    });
}

// ========================================
// ネットワーク監視
// ========================================

window.addEventListener("offline", () => {

    if (state !== "startup" &&
        state !== "waiting" &&
        state !== "error") {

        showError("ネットワークが切断されました");
    }
});

// ========================================
// 起動処理
// ========================================

window.addEventListener("load", () => {

    console.log("DEST Wireless Display Receiver 起動");
    console.log("Adapter:", ADAPTER_ID);

    showImage("1.png", "startup");

    setTimeout(() => {

        showImage("2.png", "waiting");

        startListening();

    }, START_DURATION);

});

</script>

</body>
</html>
